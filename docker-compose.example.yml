# Groovy 백엔드 MSA 스택 — 구조를 보여주는 예시/온보딩용 파일.
#
# docker-compose.local.yml과 서비스 구성·포트는 동일하지만, 비밀값 기본값을 전부
# "CHANGE_ME_*" 형태의 눈에 띄는 플레이스홀더로 바꿔뒀다 — 이 파일을 그대로 실행하면
# 동작은 하지만(로컬 전용 안전한 값은 아님) 값이 안 바뀐 채로 배포되는 실수를 막기 위한
# 것이다. 실제로 쓸 때는 이 파일을 참고해서:
#   - 로컬 개발: docker-compose.local.yml을 그대로 쓰거나
#   - 운영 배포: docker-compose.prod.yml(비밀값 필수 지정 + restart 정책 + 최소 포트 노출)을
#     쓴다.
#
# 각 서비스가 어떤 환경변수를 받는지, 서로 어떤 포트로 통신하는지 한눈에 보고 싶을 때
# 참고하는 문서 대용 파일 — 포트 전체 목록은 docs/Groovy_MSA_구조와실행.md 참고.

services:

  # Phase 7: 컨테이너 1개 안에서 스키마 소유권을 분리한다(계획서 Phase 7 원칙 — 처음부터
  # MySQL 인스턴스를 여러 개 띄우지 않는다). mysql-init/*.sql(docker-entrypoint-initdb.d)이
  # 서비스별 전용 스키마(notification_db/identity_db/study_db/calendar_db/content_db) + 전용
  # 계정을 만든다. legacy-monolith가 쓰던 groovy_db는 legacy-monolith 삭제와 함께 없앴다.
  mysql:
    image: mysql:8.0
    container_name: groovy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_root_password}
      TZ: Asia/Seoul
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-CHANGE_ME_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Phase 13: 호스트에서 ./gradlew test로 전체 스위트를 실제 DB 대상으로 돌리기 위해 노출.
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - groovy-example-net

  redis:
    image: redis:7-alpine
    container_name: groovy-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - groovy-example-net

  # Phase 9: 단일 노드 KRaft 모드(Zookeeper 없음). Kafka 공식 이미지가 기본 지원한다.
  # study-service/calendar-service/content-service의 OutboxRelay가 여기로 발행하고,
  # notification-service가 여기서 소비한다.
  # Phase 10: 클라이언트 리스너를 SASL_PLAINTEXT로 바꿔, 자격증명(username="app") 없는
  # 클라이언트는 아예 이 브로커에 연결할 수 없게 한다 — "누구나 호출 가능한 상태 아님"을
  # 네트워크 접근이 아니라 브로커 자체의 인증으로 강제한다. 컨트롤러 리스너는 그대로
  # PLAINTEXT로 둔다(단일 노드라 브로커간 트래픽이 사실상 없고, 지금 범위는 클라이언트 인증).
  kafka:
    image: apache/kafka:latest
    container_name: groovy-kafka-example
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 리스너 이름을 "SASL_PLAINTEXT"(프로토콜 이름과 동일)로 쓰면 안 된다 — 실제로 겪은 문제:
      # 이미지의 env var → 설정 변환이 언더스코어를 전부 점으로 바꿔서
      # "listener.name.sasl_plaintext..."가 "listener.name.sasl.plaintext..."로 잘못 쪼개진다.
      # 그래서 리스너 이름은 언더스코어 없는 "CLIENT"로 두고, 보안 프로토콜만 SASL_PLAINTEXT로
      # 매핑한다(리스너 이름은 그냥 별칭이라 클라이언트는 이 이름을 몰라도 된다).
      KAFKA_LISTENERS: CLIENT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: CLIENT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: CLIENT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,CLIENT:SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      # 이미지의 configure 스크립트가 SASL 리스너를 감지하면 KAFKA_OPTS가 "설정되어 있기만"
      # 해도 되는데(내용 무관, ensure()가 unset이면 하드 실패) 실제로 겪은 문제라 채워둔다.
      # 우리는 KAFKA_LISTENER_NAME_*_SASL_JAAS_CONFIG(env var) 방식을 쓰므로
      # java.security.auth.login.config 파일 방식은 필요 없다 — 그래서 나오는 경고 메시지는 무해하다.
      KAFKA_OPTS: -Dfile.encoding=UTF-8
      # 브로커 자신이 클라이언트로서 쓸 인증정보(username/password)와, 서버로서 받아줄 계정
      # 목록(user_*)을 함께 선언한다. "app"이 study-service/calendar-service/content-service/
      # notification-service가 쓰는 계정.
      KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="broker"
        password="${KAFKA_BROKER_PASSWORD:-CHANGE_ME_kafka_broker_password}"
        user_broker="${KAFKA_BROKER_PASSWORD:-CHANGE_ME_kafka_broker_password}"
        user_app="${KAFKA_APP_PASSWORD:-CHANGE_ME_kafka_app_password}";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 학습/검증 편의를 위해 자동 생성 허용 — 실제 운영이라면 토픽을 명시적으로 만들고
      # 파티션 수/보존 정책을 관리해야 한다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /tmp/adminclient.conf || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - ./kafka-init/adminclient.conf:/tmp/adminclient.conf:ro
    networks:
      - groovy-example-net

  # MSA 전환 완료: api-gateway가 모든 도메인 요청을 각 서비스로 직접 라우팅한다
  # (backend/services/api-gateway/src/main/resources/application.yml 참고). legacy-monolith는
  # 삭제됐다 — groovy/ 디렉터리 자체가 더 이상 존재하지 않는다.

  api-gateway:
    build:
      context: ./backend
      dockerfile: services/api-gateway/Dockerfile
    container_name: groovy-api-gateway-example
    depends_on:
      - notification-service
      - identity-service
      - study-service
      - calendar-service
      - content-service
      - tempo
    environment:
      # Phase 12: 요청 진입점이라 여기서 트레이스가 시작된다(TracingConfig 참고).
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
      - "${API_GATEWAY_MGMT_PORT:-8090}:8090"
    networks:
      - groovy-example-net

  # MSA 전환(identity-service 추출): User(인증) + Tag(마스터/선호 태그) 도메인이 이 서비스로
  # 옮겨왔다. identity-service가 유일한 JWT 발급자다(JwtKeyProvider/JwksController가 여기
  # 있다) — 나머지 모든 서비스가 이 서비스의 JWKS를 검증에 쓴다(아래 JWT_JWKS_URL 참고).
  # Phase 7(DB per Service) 패턴 재사용: 전용 스키마(identity_db) + 전용 계정.
  identity-service:
    build:
      context: ./backend
      dockerfile: services/identity-service/Dockerfile
    container_name: groovy-identity-service-example
    depends_on:
      mysql:
        condition: service_healthy
      tempo:
        condition: service_started
    environment:
      SPRING_DEV_DB_URL: jdbc:mysql://mysql:3306/identity_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DEV_DB_USERNAME: identity_service
      SPRING_DEV_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-CHANGE_ME_identity_db_password}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://CHANGE_ME.example.com}
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      TZ: Asia/Seoul
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:8081"
    networks:
      - groovy-example-net

  # MSA 전환(study-service 추출): Study/Application/Waitlist(+StudyTag) 도메인이 실제로 이
  # 서비스로 옮겨왔다. identity-service의 JWKS를 검증에 쓰고(발급자가 아니다), leaderName/
  # applicantName 조회는 UserServiceClient로 identity-service를 동기 호출한다. 태그 매칭에서
  # tagIds가 없으면 TagPreferenceClient로 identity-service의 "/api/tags/me"(선호 태그, Tag
  # 소유권 확정 이후 identity-service 소유)를 호출한다.
  study-service:
    build:
      context: ./backend
      dockerfile: services/study-service/Dockerfile
    container_name: groovy-study-service-example
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      SPRING_DEV_DB_URL: jdbc:mysql://mysql:3306/study_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DEV_DB_USERNAME: study_service
      SPRING_DEV_DB_PASSWORD: ${STUDY_DB_PASSWORD:-CHANGE_ME_study_db_password}
      JWT_JWKS_URL: http://identity-service:8081/.well-known/jwks.json
      JWT_JWKS_CACHE_TTL_SECONDS: 10
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://CHANGE_ME.example.com}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="app"
        password="${KAFKA_APP_PASSWORD:-CHANGE_ME_kafka_app_password}";
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      TZ: Asia/Seoul
    ports:
      - "${STUDY_SERVICE_PORT:-8082}:8082"
    networks:
      - groovy-example-net

  # MSA 전환(content-service 추출): Memoir(+댓글/좋아요) 도메인이 실제로 이 서비스로 옮겨왔다.
  # identity-service의 JWKS를 검증에 쓰고(발급자가 아니다), 스터디 멤버십 확인·요약 정보·
  # "내 스터디 옵션" 조회·경험치 적립은 StudyServiceClient로 study-service를, 작성자/댓글
  # 작성자 이름 조회는 UserServiceClient로 identity-service를 동기 호출한다. 댓글/좋아요
  # 알림은 study-service/calendar-service와 동일한 Outbox+Kafka 패턴으로 발행한다.
  content-service:
    build:
      context: ./backend
      dockerfile: services/content-service/Dockerfile
    container_name: groovy-content-service-example
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
      study-service:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      SPRING_DEV_DB_URL: jdbc:mysql://mysql:3306/content_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DEV_DB_USERNAME: content_service
      SPRING_DEV_DB_PASSWORD: ${CONTENT_DB_PASSWORD:-CHANGE_ME_content_db_password}
      JWT_JWKS_URL: http://identity-service:8081/.well-known/jwks.json
      JWT_JWKS_CACHE_TTL_SECONDS: 10
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://CHANGE_ME.example.com}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      STUDY_SERVICE_URL: http://study-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="app"
        password="${KAFKA_APP_PASSWORD:-CHANGE_ME_kafka_app_password}";
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      TZ: Asia/Seoul
    ports:
      - "${CONTENT_SERVICE_PORT:-8083}:8083"
    networks:
      - groovy-example-net

  # MSA 전환(calendar-service 추출): Calendar(개인 일정 + 스터디 약속) 도메인이 실제로 이
  # 서비스로 옮겨왔다. identity-service의 JWKS를 검증에 쓰고(발급자가 아니다), 스터디 멤버십
  # 확인·승인 멤버 목록·"내 스터디 옵션" 조회는 StudyServiceClient로 study-service를 동기
  # 호출한다(groovy가 이미 쓰던 것과 동일한 계약, study-service 추출 때 처음 생김).
  calendar-service:
    build:
      context: ./backend
      dockerfile: services/calendar-service/Dockerfile
    container_name: groovy-calendar-service-example
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
      study-service:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      SPRING_DEV_DB_URL: jdbc:mysql://mysql:3306/calendar_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DEV_DB_USERNAME: calendar_service
      SPRING_DEV_DB_PASSWORD: ${CALENDAR_DB_PASSWORD:-CHANGE_ME_calendar_db_password}
      JWT_JWKS_URL: http://identity-service:8081/.well-known/jwks.json
      JWT_JWKS_CACHE_TTL_SECONDS: 10
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://CHANGE_ME.example.com}
      STUDY_SERVICE_URL: http://study-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="app"
        password="${KAFKA_APP_PASSWORD:-CHANGE_ME_kafka_app_password}";
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      TZ: Asia/Seoul
    ports:
      - "${CALENDAR_SERVICE_PORT:-8084}:8084"
    networks:
      - groovy-example-net

  # Phase 6에서 첫 번째로 추출된 서비스, Phase 7에서 자기 스키마(notification_db)와 그
  # 스키마에만 권한이 있는 전용 계정(notification_service)을 갖는다 — 다른 서비스와 더 이상
  # DB 계정도, 스키마도 공유하지 않는다. 자체 Redis pub/sub + 구독 티켓 저장은 그대로.
  notification-service:
    build:
      context: ./backend
      dockerfile: services/notification-service/Dockerfile
    container_name: groovy-notification-service-example
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      tempo:
        condition: service_started
    environment:
      SPRING_DEV_DB_URL: jdbc:mysql://mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DEV_DB_USERNAME: notification_service
      SPRING_DEV_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-CHANGE_ME_notification_db_password}
      # MSA 전환(identity-service 추출): identity-service가 유일한 JWT 발급자다 —
      # JwksKeyLocator가 identity-service의 공개키로 검증만 한다.
      JWT_JWKS_URL: http://identity-service:8081/.well-known/jwks.json
      # 예시값(10초) — 운영에서는 5분(300) 권장, docker-compose.prod.yml 참고.
      JWT_JWKS_CACHE_TTL_SECONDS: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="app"
        password="${KAFKA_APP_PASSWORD:-CHANGE_ME_kafka_app_password}";
      # Phase 12: 발행자(study/calendar/content-service)가 Kafka로 실어보낸 traceId를
      # 이어받아 같은 트레이스로 스팬을 잇는다.
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      TZ: Asia/Seoul
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8085}:8085"
    networks:
      - groovy-example-net

  # --- Phase 12: 분산 Observability(트레이싱). Loki/Alloy는 스택에 상관없이 그대로 재사용
  # --- 가능해서(Alloy가 Docker 소켓으로 "모든" 컨테이너를 자동 탐지) monitoring-msa/에 옮긴
  # --- 원본 파일을 읽기 전용으로 그대로 마운트한다.

  tempo:
    image: grafana/tempo:latest
    container_name: groovy-tempo-example
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring-msa/tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "${TEMPO_QUERY_PORT:-3200}:3200"
    networks:
      - groovy-example-net

  loki:
    image: grafana/loki:latest
    container_name: groovy-loki-example
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./monitoring-msa/loki/config.yaml:/etc/loki/config.yaml:ro
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - groovy-example-net

  # notification-service/api-gateway 등 각 서비스의 JSON 구조화 로그(stdout)를 컨테이너
  # 이름 기반으로 자동 수집한다 — 각 서비스에 로그 수집용 설정을 따로 추가할 필요가 없다.
  alloy:
    image: grafana/alloy:latest
    container_name: groovy-alloy-example
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./monitoring-msa/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - groovy-example-net

  grafana:
    image: grafana/grafana:latest
    container_name: groovy-grafana-example
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./monitoring-msa/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - tempo
      - loki
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - groovy-example-net

  # --- 레거시 모놀리식 시절 monitoring/ 스택이 제공하던 메트릭 정보(JVM/HTTP, 컨테이너 리소스,
  # --- 호스트 리소스, MySQL, Slack 알림)를 MSA 스택에도 동일하게 제공한다. prometheus.yml은
  # --- 서비스별 job으로 나뉘어 있다.
  prometheus:
    image: prom/prometheus:latest
    container_name: groovy-prometheus-example
    depends_on:
      - cadvisor
      - mysqld-exporter
      - alertmanager
    volumes:
      - ./monitoring-msa/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring-msa/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - groovy-msa-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    networks:
      - groovy-example-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: groovy-cadvisor-example
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/lib/dbus/machine-id:/var/lib/dbus/machine-id:ro
    expose:
      - "8080"
    networks:
      - groovy-example-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: groovy-node-exporter-example
    pid: host
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - groovy-example-net

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: groovy-mysqld-exporter-example
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - "--mysqld.address=mysql:3306"
      - "--mysqld.username=root"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    expose:
      - "9104"
    networks:
      - groovy-example-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: groovy-alertmanager-example
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/slack_webhook_url:/tmp/slack_webhook_url:ro
      - groovy-msa-alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - groovy-example-net

volumes:
  groovy-msa-prometheus-data:
  groovy-msa-alertmanager-data:

networks:
  groovy-example-net:
    driver: bridge
