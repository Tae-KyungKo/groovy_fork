name: Build and Push Docker Images

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: |
            bebeghi/groovy-frontend:latest
            bebeghi/groovy-frontend:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./groovy
          file: ./groovy/Dockerfile
          push: true
          tags: |
            bebeghi/groovy-backend:latest
            bebeghi/groovy-backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::665206375378:role/groovy-github-actions-ssm-role
          aws-region: ap-northeast-2

      - name: Deploy via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-04c649bc3b17666b3" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Groovy via GitHub Actions" \
            --parameters commands='[
            "set -e",
            "cd /home/ec2-user/groovy",
            "docker compose --env-file .env -f docker-compose.ec2.yml pull",
            "docker compose --env-file .env -f docker-compose.ec2.yml up -d"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-04c649bc3b17666b3"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-04c649bc3b17666b3" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}"