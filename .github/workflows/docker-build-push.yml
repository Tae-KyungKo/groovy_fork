name: Docker Build and Push

on:
  push:
    branches:
      - feat/first-merged-branch

  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: |
            bebeghi/groovy-frontend:latest
            bebeghi/groovy-frontend:observability-v1
            bebeghi/groovy-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./groovy
          file: ./groovy/Dockerfile
          push: true
          tags: |
            bebeghi/groovy-backend:latest
            bebeghi/groovy-backend:observability-v1
            bebeghi/groovy-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max