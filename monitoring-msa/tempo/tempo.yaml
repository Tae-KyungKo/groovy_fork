# MSA 전환 Phase 12: Grafana Tempo 공식 예제
# (https://github.com/grafana/tempo/blob/main/example/docker-compose/single-binary/tempo.yaml)를
# 기준으로, Prometheus remote-write가 필요한 metrics_generator 섹션은 뺐다(이 검증 스택엔
# Prometheus가 없음 — Phase 12 완료 기준은 트레이싱+로그이지 메트릭이 아니다).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "tempo:4317"
        http:
          endpoint: "tempo:4318"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
