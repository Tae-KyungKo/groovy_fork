spring:
  application:
    name: groovy-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DEV_DB_URL:jdbc:mysql://localhost:3306/groovy_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DEV_DB_USERNAME:root}
    password: ${SPRING_DEV_DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: GroovyHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:3000}
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    # 이미 ddl-auto=update로 스키마가 존재하는(운영) DB를 위한 설정.
    baseline-on-migrate: true
    baseline-version: 1
  # MSA 전환 Phase 9: OutboxRelay가 이 KafkaTemplate으로 Kafka에 이벤트를 발행한다.
  # Phase 10: SASL/PLAIN 인증을 추가해 자격증명 없는 클라이언트는 이 브로커에 붙을 수 없게
  # 한다("서비스 간 내부 API 호출에 별도 인증 메커니즘 존재"). 로컬(비Docker) 개발은 계속
  # PLAINTEXT 기본값을 쓴다 — docker-compose.msa.yml만 컨테이너 환경에서 SASL로 덮어쓴다.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Phase 8에서 배운 원칙(타임아웃 기본값 방치 금지)을 프로듀서에도 적용한다.
      # max.block.ms 기본값(60s)을 그대로 두면 브로커가 죽었을 때 send() 호출 자체가
      # OutboxRelay.relay()의 KafkaTemplate.send(...).get(3, SECONDS)보다 훨씬 먼저,
      # 훨씬 오래 막혀버린다(그 3초 타임아웃이 적용될 기회조차 없다).
      properties:
        max.block.ms: 2000
        request.timeout.ms: 2000
        delivery.timeout.ms: 3000
    template:
      # Phase 12: OutboxRelay가 발행하는 메시지에 traceId를 실어 notification-service까지 전파한다.
      observation-enabled: true

server:
  port: ${SERVER_PORT:8080}
  # 없으면 spring-boot 3.0 이상에서 CORS 오류 발생
  # -> request.isSecure() 같은 게 nginx 뒤에서도 http로 잘못 인식
  forward-headers-strategy: framework

# MSA 전환 Phase 10: 더 이상 JWT_SECRET_KEY(HMAC 공유 시크릿)를 쓰지 않는다.
# JwtKeyProvider가 기동 시 RSA 키 쌍을 직접 만들고, 공개키는 /.well-known/jwks.json으로 공개한다.

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# MSA 전환 Phase 12: Boot 4.1의 spring-boot-opentelemetry/spring-boot-micrometer-tracing은
# 이 두 프로퍼티를 자동으로 읽어주지 않는다(OTLP 트레이스 익스포트 오토컨피그가 아예 없음,
# TracingConfig 클래스 주석 참고) — TracingConfig가 @Value로 직접 읽어서 수동 조립할 때 쓴다.
management:
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: groovy-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
