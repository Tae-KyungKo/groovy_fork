spring:
  application:
    name: groovy-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DEV_DB_URL:jdbc:mysql://localhost:3306/groovy_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DEV_DB_USERNAME:root}
    password: ${SPRING_DEV_DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: GroovyHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:3000}
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    # 이미 ddl-auto=update로 스키마가 존재하는(운영) DB를 위한 설정.
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:8080}
  # 없으면 spring-boot 3.0 이상에서 CORS 오류 발생
  # -> request.isSecure() 같은 게 nginx 뒤에서도 http로 잘못 인식
  forward-headers-strategy: framework

jwt:
  secret-key: ${JWT_SECRET_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: groovy-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
