plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.groovy'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	jjwtVersion = '0.12.6' // Phase 2 JWT 인증 구현을 대비해 선반영, 현재 단계에서는 시큐리티 permitAll로만 사용
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// MSA 전환 Phase 12: 분산 트레이싱. Boot 4.1은 트레이싱도 Flyway/Kafka와 같은 패턴으로
	// spring-boot-starter-actuator에 자동 포함되지 않고 별도 모듈로 분리해뒀다(Maven Central에서
	// 확인) — spring-boot-micrometer-tracing(Micrometer Tracing 오토컨피그), spring-boot-opentelemetry
	// (OTel SDK 오토컨피그)를 명시적으로 추가해야 한다. bridge-otel이 Micrometer↔OTel을 잇고,
	// exporter-otlp가 실제로 Tempo로 스팬을 전송한다.
	implementation 'org.springframework.boot:spring-boot-micrometer-tracing'
	implementation 'org.springframework.boot:spring-boot-opentelemetry'
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

	// flyway를 위한 의존성 추가
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// MSA 전환 Phase 9: Transactional Outbox Relay가 Kafka로 이벤트를 발행하는 데 사용.
	// Boot 4.1은 Kafka 오토컨피그도 spring-boot-flyway처럼 별도 모듈로 분리했다 —
	// org.springframework.kafka:spring-kafka만 넣으면 KafkaTemplate 빈이 자동 생성되지 않는다
	// (실제로 겪은 문제. spring-boot-starter-kafka가 spring-boot-kafka 오토컨피그 + spring-kafka를
	// 함께 끌어온다).
	implementation 'org.springframework.boot:spring-boot-starter-kafka'

	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'

	// Loki & Alloy로 수집되는 로그를 필드 기반으로 조회할 수 있도록 JSON 구조화
	implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// MSA 전환 Phase 1: 도메인 간 Repository 직접 접근을 CI에서 자동으로 잡아내기 위한 아키텍처 테스트
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
