backend:
  build:
    context: ./groovy
    dockerfile: Dockerfile

  container_name: groovy-backend

  restart: unless-stopped

  depends_on:
    mysql:
      condition: service_healthy

  ports:
    - "8080:8080"

  environment:
    SPRING_DEV_DB_URL: jdbc:mysql://mysql:3306/groovy_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    SPRING_DEV_DB_USERNAME: root
    SPRING_DEV_DB_PASSWORD: root
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:-groovy_secret_key_1234567890}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    SERVER_PORT: 8080

  networks:
    - groovy_network