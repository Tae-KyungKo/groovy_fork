# MSA 전환 Phase 4: 서비스를 실제로 코드에서 분리하기 전에, Compose 환경에서 여러 컨테이너가
# 이름 기반으로 통신할 수 있는 기반부터 만든다(Groovy_MSA_전환계획.md Phase 4).
#
# 기존 docker-compose.yml(로컬 통합 개발)/docker-compose.prod.yml(운영)은 건드리지 않는다 —
# 이 파일은 MSA 골격을 검증하기 위한 별도 스택이라 포트를 전부 18xxx대로 옮겨 기존 스택과
# 동시에 띄워도 충돌하지 않는다. 실제 운영 포트 체계(게이트웨이가 8080을 받는 것)는
# Phase 5(API Gateway 도입)에서 기존 docker-compose.yml을 대체할 때 정리한다.
#
# 사용법:
#   docker compose -f docker-compose.msa.yml up -d --build
#   docker compose -f docker-compose.msa.yml down
#
# 완료 기준 검증(계획서 Phase 4):
#   1) 레거시 모놀리스 + 신규 빈 서비스 컨테이너가 동시에 뜨는지  -> docker compose ps
#   2) 컨테이너 간 이름 기반 통신되는지                          -> 아래 참고
#      docker exec groovy-msa-api-gateway wget -qO- http://notification-service:8085/

services:

  # Phase 7: 컨테이너 1개 안에서 스키마 소유권을 분리한다(계획서 Phase 7 원칙 — 처음부터
  # MySQL 인스턴스를 여러 개 띄우지 않는다). MYSQL_DATABASE가 legacy용 groovy_db를 만들고,
  # mysql-init/*.sql(docker-entrypoint-initdb.d)이 notification_db + 전용 계정을 추가로 만든다.
  msa-mysql:
    image: mysql:8.0
    container_name: groovy-msa-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-groovy_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      TZ: Asia/Seoul
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Phase 13: 호스트에서 ./gradlew test로 전체 스위트를 실제 DB 대상으로 돌리기 위해 노출.
    ports:
      - "${MSA_MYSQL_PORT:-18306}:3306"
    networks:
      - groovy-msa-net

  msa-redis:
    image: redis:7-alpine
    container_name: groovy-msa-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - groovy-msa-net

  # Phase 9: 단일 노드 KRaft 모드(Zookeeper 없음). Kafka 공식 이미지가 기본 지원한다.
  # legacy의 OutboxRelay가 여기로 발행하고, notification-service가 여기서 소비한다.
  # Phase 10: 클라이언트 리스너를 SASL_PLAINTEXT로 바꿔, 자격증명(username="app") 없는
  # 클라이언트는 아예 이 브로커에 연결할 수 없게 한다 — "누구나 호출 가능한 상태 아님"을
  # 네트워크 접근이 아니라 브로커 자체의 인증으로 강제한다. 컨트롤러 리스너는 그대로
  # PLAINTEXT로 둔다(단일 노드라 브로커간 트래픽이 사실상 없고, 지금 범위는 클라이언트 인증).
  kafka:
    image: apache/kafka:latest
    container_name: groovy-msa-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 리스너 이름을 "SASL_PLAINTEXT"(프로토콜 이름과 동일)로 쓰면 안 된다 — 실제로 겪은 문제:
      # 이미지의 env var → 설정 변환이 언더스코어를 전부 점으로 바꿔서
      # "listener.name.sasl_plaintext..."가 "listener.name.sasl.plaintext..."로 잘못 쪼개진다.
      # 그래서 리스너 이름은 언더스코어 없는 "CLIENT"로 두고, 보안 프로토콜만 SASL_PLAINTEXT로
      # 매핑한다(리스너 이름은 그냥 별칭이라 클라이언트는 이 이름을 몰라도 된다).
      KAFKA_LISTENERS: CLIENT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: CLIENT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: CLIENT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,CLIENT:SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      # 이미지의 configure 스크립트가 SASL 리스너를 감지하면 KAFKA_OPTS가 "설정되어 있기만"
      # 해도 되는데(내용 무관, ensure()가 unset이면 하드 실패) 실제로 겪은 문제라 채워둔다.
      # 우리는 KAFKA_LISTENER_NAME_*_SASL_JAAS_CONFIG(env var) 방식을 쓰므로
      # java.security.auth.login.config 파일 방식은 필요 없다 — 그래서 나오는 경고 메시지는 무해하다.
      KAFKA_OPTS: -Dfile.encoding=UTF-8
      # 브로커 자신이 클라이언트로서 쓸 인증정보(username/password)와, 서버로서 받아줄 계정
      # 목록(user_*)을 함께 선언한다. "app"이 legacy-monolith/notification-service가 쓰는 계정.
      KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="broker"
        password="${KAFKA_BROKER_PASSWORD:-broker-secret}"
        user_broker="${KAFKA_BROKER_PASSWORD:-broker-secret}"
        user_app="${KAFKA_APP_PASSWORD:-app-secret}";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 학습/검증 편의를 위해 자동 생성 허용 — 실제 운영이라면 토픽을 명시적으로 만들고
      # 파티션 수/보존 정책을 관리해야 한다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /tmp/adminclient.conf || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - ./kafka-init/adminclient.conf:/tmp/adminclient.conf:ro
    networks:
      - groovy-msa-net

  # 기존 모놀리스. Phase 6에서 Notification이 빠져나갔고, 이후 남은 서비스들도 하나씩
  # 추출될 때까지 그대로 유지한다(Strangler Fig). 더 이상 Redis를 쓰지 않는다(알림 전용이었음).
  legacy-monolith:
    build:
      context: ./groovy
      dockerfile: Dockerfile
    container_name: groovy-msa-legacy-monolith
    depends_on:
      msa-mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      tempo:
        condition: service_started
    environment:
      SPRING_DEV_DB_URL: jdbc:mysql://msa-mysql:3306/${MYSQL_DATABASE:-groovy_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DEV_DB_USERNAME: root
      SPRING_DEV_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      # Phase 10: JWT_SECRET_KEY(HMAC 공유 시크릿) 제거 — JwtKeyProvider가 자체 RSA 키를
      # 만들고 공개키만 /.well-known/jwks.json으로 공개한다. 더 이상 어떤 서비스와도
      # "시크릿"을 공유하지 않는다.
      #
      # Phase 9: 알림 생성은 더 이상 HTTP 동기 호출이 아니라 Outbox+Kafka를 거친다
      # (global/outbox/OutboxRelay, global/notification/NotificationOutboxPublisher).
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Phase 10: Kafka 자체도 인증 없이는 못 붙게 한다.
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="app"
        password="${KAFKA_APP_PASSWORD:-app-secret}";
      # Phase 12: 이 요청에서 시작된 스팬을 Tempo로 보낸다(TracingConfig 참고).
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      TZ: Asia/Seoul
    ports:
      - "${LEGACY_MONOLITH_PORT:-8086}:8080"
    networks:
      - groovy-msa-net

  # --- Phase 5부터 api-gateway는 실제 라우팅을 한다. Phase 6부터 notification-service에
  # --- 실제 도메인 코드가 채워졌다. 나머지 4개는 아직 Phase 3의 빈 골격 그대로. ---

  api-gateway:
    build:
      context: ./backend
      dockerfile: services/api-gateway/Dockerfile
    container_name: groovy-msa-api-gateway
    depends_on:
      - legacy-monolith
      - notification-service
      - tempo
    environment:
      # Phase 12: 요청 진입점이라 여기서 트레이스가 시작된다(TracingConfig 참고).
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
    ports:
      - "${API_GATEWAY_PORT:-18080}:8080"
      - "${API_GATEWAY_MGMT_PORT:-18090}:8090"
    networks:
      - groovy-msa-net

  identity-service:
    build:
      context: ./backend
      dockerfile: services/identity-service/Dockerfile
    container_name: groovy-msa-identity-service
    ports:
      - "${IDENTITY_SERVICE_PORT:-18081}:8081"
    networks:
      - groovy-msa-net

  study-service:
    build:
      context: ./backend
      dockerfile: services/study-service/Dockerfile
    container_name: groovy-msa-study-service
    ports:
      - "${STUDY_SERVICE_PORT:-18082}:8082"
    networks:
      - groovy-msa-net

  content-service:
    build:
      context: ./backend
      dockerfile: services/content-service/Dockerfile
    container_name: groovy-msa-content-service
    ports:
      - "${CONTENT_SERVICE_PORT:-18083}:8083"
    networks:
      - groovy-msa-net

  calendar-service:
    build:
      context: ./backend
      dockerfile: services/calendar-service/Dockerfile
    container_name: groovy-msa-calendar-service
    ports:
      - "${CALENDAR_SERVICE_PORT:-18084}:8084"
    networks:
      - groovy-msa-net

  # Phase 6에서 첫 번째로 추출된 서비스, Phase 7에서 자기 스키마(notification_db)와 그
  # 스키마에만 권한이 있는 전용 계정(notification_service)을 갖는다 — legacy와 더 이상
  # DB 계정도, 스키마도 공유하지 않는다. 자체 Redis pub/sub + 구독 티켓 저장은 그대로.
  notification-service:
    build:
      context: ./backend
      dockerfile: services/notification-service/Dockerfile
    container_name: groovy-msa-notification-service
    depends_on:
      msa-mysql:
        condition: service_healthy
      msa-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      tempo:
        condition: service_started
    environment:
      SPRING_DEV_DB_URL: jdbc:mysql://msa-mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DEV_DB_USERNAME: notification_service
      SPRING_DEV_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_service_local_only_pw}
      # Phase 10: JWT_SECRET_KEY 제거 — JwksKeyLocator가 legacy-monolith의 공개키만 가져다 쓴다.
      JWT_JWKS_URL: http://legacy-monolith:8080/.well-known/jwks.json
      # Phase 11: 이 검증 스택에서는 캐시 TTL을 짧게 둬서 legacy-monolith가 죽어 있는 동안
      # Retry/CircuitBreaker/Fallback이 실제로 발동하는 걸 재현하기 쉽게 한다(운영 기본값은 5분).
      JWT_JWKS_CACHE_TTL_SECONDS: 10
      REDIS_HOST: msa-redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="app"
        password="${KAFKA_APP_PASSWORD:-app-secret}";
      # Phase 12: legacy가 Kafka로 실어보낸 traceId를 이어받아 같은 트레이스로 스팬을 잇는다.
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      TZ: Asia/Seoul
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-18085}:8085"
    networks:
      - groovy-msa-net

  # --- Phase 12: 분산 Observability(트레이싱). 기존 monitoring/ 스택(Loki/Alloy)은 스택에
  # --- 상관없이 그대로 재사용 가능해서(Alloy가 Docker 소켓으로 "모든" 컨테이너를 자동 탐지) 원본
  # --- 파일을 읽기 전용으로 그대로 마운트한다. Grafana 프로비저닝(Tempo 데이터소스 추가)과
  # --- Tempo 설정만 monitoring-msa/에 새로 둔다 — 원본 monitoring/은 기존 docker-compose.yml이
  # --- 쓰고 있어 건드리지 않는다.

  tempo:
    image: grafana/tempo:latest
    container_name: groovy-msa-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring-msa/tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "${TEMPO_QUERY_PORT:-18200}:3200"
    networks:
      - groovy-msa-net

  loki:
    image: grafana/loki:latest
    container_name: groovy-msa-loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./monitoring/loki/config.yaml:/etc/loki/config.yaml:ro
    ports:
      - "${LOKI_PORT:-18310}:3100"
    networks:
      - groovy-msa-net

  # legacy-monolith/notification-service/api-gateway의 JSON 구조화 로그(stdout)를 컨테이너
  # 이름 기반으로 자동 수집한다 — 각 서비스에 로그 수집용 설정을 따로 추가할 필요가 없다.
  alloy:
    image: grafana/alloy:latest
    container_name: groovy-msa-alloy
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - groovy-msa-net

  grafana:
    image: grafana/grafana:latest
    container_name: groovy-msa-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./monitoring-msa/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - tempo
      - loki
    ports:
      - "${GRAFANA_PORT:-18300}:3000"
    networks:
      - groovy-msa-net

networks:
  groovy-msa-net:
    driver: bridge
