server {
    listen 443 ssl;
    server_name beancp.com;

    ssl_certificate /etc/letsencrypt/live/beancp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beancp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # SSE(EventSource)는 응답을 이벤트가 생기는 대로 바로 흘려보내야 하는데, 기본 프록시
    # 설정(버퍼링 on, read timeout 60s)이면 이벤트가 지연되거나 유휴 60초 후 연결이 끊긴다.
    # /api/ 블록보다 더 구체적인 경로라 먼저 매칭된다.
    location /api/notifications/subscribe {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Lets Encrypt 인증서 발급을 위한 설정
server {
    listen 80;
    listen [::]:80;
    server_name beancp.com;
    access_log off;

    # Let's Encrypt 인증을 위한 예외 처리
    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/certbot;
    }

    # 나머지 요청은 HTTPS로 리디렉션
    location / {
        return 301 https://$host$request_uri;
    }
}